<!DOCTYPE html>
<html lang="ms"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistem Maklumat Urusan Nikah, Cerai dan Rujuk</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--g:#0b5d3b;--g2:#e8f3ec;--au:#b8912f;--bg:#fbfaf5;--tx:#1f2a24;--card:#fff;--bd:#dcd6c0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g:#0b5d3b;--g2:#e8f3ec;--au:#b8912f;--bg:#fbfaf5;--tx:#1f2a24;--card:#fff;--bd:#dcd6c0}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,Segoe UI,Arial,sans-serif;line-height:1.55}
header{background:var(--g);color:#fff;padding:18px 16px;text-align:center;border-bottom:4px solid var(--au)}
header h1{margin:0;font-size:1.25rem}header p{margin:4px 0 0;font-size:.85rem;color:#e6d9a8}
.wrap{max-width:900px;margin:0 auto;padding:14px}
nav{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
nav a{font-size:.8rem;background:var(--g2);color:var(--g);border:1px solid var(--bd);padding:5px 9px;border-radius:14px;text-decoration:none}
.bar{display:flex;gap:8px;justify-content:flex-end;margin-bottom:10px}
section{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--au);border-radius:10px;padding:14px;margin-bottom:16px}
.sh{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:8px}
.sh h2{margin:0;font-size:1.05rem;color:var(--g);flex:1 1 260px}
button{font:inherit;font-size:.82rem;padding:6px 11px;border-radius:7px;border:1px solid var(--g);background:#fff;color:var(--g);cursor:pointer}
button.p{background:var(--g);color:#fff}button.d{border-color:#a33;color:#a33}button.d.c{background:#a33;color:#fff}
.item{border:1px solid var(--bd);border-left:4px solid var(--g);border-radius:8px;padding:10px;margin:8px 0;background:#fffefa}
.item h3{margin:0 0 4px;font-size:.95rem}.item .c{white-space:pre-wrap;font-size:.9rem}
.acts{margin-top:8px;display:flex;gap:6px}
.empty{color:#777;font-style:italic;font-size:.88rem}
input,textarea{width:100%;font:inherit;font-size:.9rem;padding:7px;border:1px solid var(--bd);border-radius:6px;margin:3px 0 6px;background:#fff;color:var(--tx)}
textarea{min-height:110px}
.form{background:var(--g2);padding:10px;border-radius:8px;margin:8px 0}
footer{text-align:center;font-size:.75rem;color:#777;padding:10px 0 24px}
.ph{display:none}
@media print{header nav,.bar,.acts,.sh button,.form,footer,.addbtn{display:none!important}
body{background:#fff}section{border:0;border-top:2px solid #000;break-inside:avoid-page;box-shadow:none}
body.one section:not(.pr){display:none}.ph{display:block;text-align:center;font-weight:bold;margin-bottom:8px}
header{background:#fff;color:#000;border-bottom:2px solid #000}header p{color:#000}header nav{display:none}}
</style></head><body>
<header><h1>Sistem Maklumat Urusan Nikah, Cerai dan Rujuk</h1>
<p>Pejabat Kadi Daerah &amp; Bahagian Undang-undang Syariah</p></header>
<div class="wrap">
<nav id="nav"></nav>
<div class="bar"><button class="p" onclick="printSec()">🖨 Cetak Semua</button><button onclick="printSec()">⬇ PDF Semua</button></div>
<div id="app"></div>
<footer>Maklumat disimpan dalam pelayar peranti ini. Untuk PDF: tekan “PDF”, kemudian pilih “Simpan sebagai PDF” pada tetingkap cetak.</footer>
</div>
<script>
var S=[["s1","Waktu Operasi Pejabat Kadi"],["s2","Waktu Operasi Bahagian Undang-undang Syariah"],["s3","Proses dan Urusan Dokumentasi Pernikahan"],["s4","Proses dan Urusan Dokumentasi Permohonan Kad Nikah"],["s5","Proses dan Urusan Dokumentasi Pernikahan Luar Negara dan Pernikahan dengan Pasangan Warga Asing"],["s6","Proses dan Urusan Dokumentasi Perceraian"],["s7","Proses dan Urusan Dokumentasi Rujuk"],["s8","Jenis-jenis Caj dan Bayaran bagi Urusan Pernikahan dan Dokumentasi"]];
var K="portal_kadi_v1",D={},edit=null;
try{D=JSON.parse(localStorage.getItem(K)||"{}")}catch(e){D={}}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function list(id){return D[id]||(D[id]=[])}
function form(id,it){var n=it?it.id:"";return '<div class="form"><input id="t_'+id+n+'" placeholder="Tajuk kecil" value="'+(it?esc(it.t):"")+'"><textarea id="c_'+id+n+'" placeholder="Kandungan maklumat">'+(it?esc(it.c):"")+'</textarea><button class="p" onclick="commit(\''+id+'\',\''+n+'\')">Simpan</button> <button onclick="edit=null;render()">Batal</button></div>'}
function render(){
 document.getElementById("nav").innerHTML=S.map(function(s,i){return '<a href="#'+s[0]+'">'+(i+1)+'</a>'}).join("");
 document.getElementById("app").innerHTML=S.map(function(s,i){var id=s[0],L=list(id);
  var h='<section id="'+id+'"><div class="ph">Pejabat Kadi Daerah / Bahagian Undang-undang Syariah</div><div class="sh"><h2>'+(i+1)+'. '+s[1]+'</h2><span><button onclick="printSec(\''+id+'\')">🖨 Cetak</button> <button onclick="printSec(\''+id+'\')">⬇ PDF</button></span></div>';
  if(!L.length)h+='<p class="empty">Belum ada maklumat. Tekan “Tambah Maklumat”.</p>';
  L.forEach(function(it){
   if(edit===id+it.id)h+=form(id,it);
   else h+='<div class="item"><h3>'+esc(it.t)+'</h3><div class="c">'+esc(it.c)+'</div><div class="acts"><button onclick="edit=\''+id+it.id+'\';render()">Sunting</button><button class="d" onclick="del(this,\''+id+'\',\''+it.id+'\')">Padam</button></div></div>'});
  if(edit===id+"new")h+=form(id,null);
  else h+='<button class="p addbtn" onclick="edit=\''+id+'new\';render()">+ Tambah Maklumat</button>';
  return h+'</section>'}).join("")}
function commit(id,n){var t=document.getElementById("t_"+id+n).value.trim(),c=document.getElementById("c_"+id+n).value.trim();
 if(!t&&!c)return;var L=list(id);
 if(n){L.forEach(function(x){if(x.id===n){x.t=t;x.c=c}})}else L.push({id:"i"+Date.now(),t:t,c:c});
 edit=null;save();render()}
function del(b,id,n){if(!b.classList.contains("c")){b.classList.add("c");b.textContent="Sahkan padam?";return}
 D[id]=list(id).filter(function(x){return x.id!==n});save();render()}
function printSec(id){document.querySelectorAll("section").forEach(function(s){s.classList.toggle("pr",!id||s.id===id)});
 document.body.classList.toggle("one",!!id);window.print()}
render();
</script></body></html>

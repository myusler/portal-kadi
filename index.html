</style></head><body>
<canvas id="bg" class="fixed inset-0 -z-10 h-full w-full" aria-hidden="true"></canvas>
<header><h1>Sistem Maklumat Urusan Nikah, Cerai dan Rujuk</h1>
<p>Pejabat Kadi Daerah &amp; Bahagian Undang-undang Syariah</p></header>
<div class="wrap">
<nav id="nav"></nav>
<div class="search">
<div class="sbox"><input id="q" type="search" placeholder="🔍 Cari maklumat (contoh: bayaran kad nikah)" autocomplete="off" oninput="setQ(this.value)" onkeydown="if(event.key==='Escape')clearQ();else if(event.key==='Enter')focusTop()"><button id="qc" onclick="clearQ()" style="display:none">✕ Kosongkan</button></div>
<div class="sinfo" id="sinfo" aria-live="polite"></div>
</div>
<div class="bar"><span id="auth"></span><span><button class="p" onclick="printSec()">🖨 Cetak Semua</button> <button onclick="printSec()">⬇ PDF Semua</button></span></div>
<div id="login" class="form" style="display:none">
<input id="em" type="email" placeholder="E-mel admin" autocomplete="username">
<input id="pw" type="password" placeholder="Kata laluan" autocomplete="current-password">
<button class="p" onclick="doLogin()">Log Masuk</button> <span id="lerr" class="err"></span></div>
<div id="app"><p class="empty">Memuatkan maklumat…</p></div>
<footer>Untuk PDF: tekan “PDF”, kemudian pilih “Simpan sebagai PDF” pada tetingkap cetak. Jika carian aktif, hanya hasil carian dicetak.</footer>
</div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import{getFirestore,collection,onSnapshot,addDoc,updateDoc,deleteDoc,doc}from"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDOqhMMyPgsUs0VvtTIjHHehFd5Wjfrkls",authDomain:"portal-kadi.firebaseapp.com",projectId:"portal-kadi",storageBucket:"portal-kadi.firebasestorage.app",messagingSenderId:"73623022999",appId:"1:73623022999:web:896773ee988957790ba8d2"});
const auth=getAuth(app),db=getFirestore(app),col=collection(db,"maklumat");
const S=[["s1","Waktu Operasi Pejabat Kadi"],["s2","Waktu Operasi Bahagian Undang-undang Syariah"],["s3","Proses dan Urusan Dokumentasi Pernikahan"],["s4","Proses dan Urusan Dokumentasi Permohonan Kad Nikah"],["s5","Proses dan Urusan Dokumentasi Pernikahan Luar Negara dan Pernikahan dengan Pasangan Warga Asing"],["s6","Proses dan Urusan Dokumentasi Perceraian"],["s7","Proses dan Urusan Dokumentasi Rujuk"],["s8","Jenis-jenis Caj dan Bayaran bagi Urusan Pernikahan dan Dokumentasi"]];
let D=[],user=null,edit=null,ready=false,q="",showAll=false;const opened=new Set();
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reEsc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const $=i=>document.getElementById(i);
const words=()=>q.toLowerCase().split(/\s+/).filter(Boolean);
const secOf=id=>{const i=S.findIndex(s=>s[0]===id);return i<0?{n:0,t:""}:{n:i+1,t:S[i][1]}};
//RANK-START
function rankItems(items,qs,secTitle){
 const w=qs.toLowerCase().split(/\s+/).filter(Boolean),ph=w.join(" ");
 if(!w.length)return{list:[],partial:false};
 const cnt=(h,k)=>h.split(k).length-1;
 const rows=items.map(x=>{const t=(x.t||"").toLowerCase(),c=(x.c||"").toLowerCase(),st=(secTitle(x.sec)||"").toLowerCase();
  const inT=w.filter(k=>t.includes(k)).length,inC=w.filter(k=>c.includes(k)).length,inAny=w.filter(k=>t.includes(k)||c.includes(k)).length,inS=w.filter(k=>st.includes(k)).length;
  const sc=inT*20+inC*5+inAny*10+(t.includes(ph)?100:0)+(c.includes(ph)?40:0)+w.reduce((a,k)=>a+Math.min(3,cnt(c,k)),0)+inS*2;
  return{x,inAny,sc}});
 let list=rows.filter(r=>r.inAny===w.length),partial=false;
 if(!list.length){list=rows.filter(r=>r.inAny>0);partial=true}
 list.sort((a,b)=>b.sc-a.sc||(a.x.ts||0)-(b.x.ts||0));
 return{list,partial}}
//RANK-END
function hl(s){const w=words();if(!w.length)return esc(s);const re=new RegExp("("+w.map(reEsc).join("|")+")","gi");return s.split(re).map((p,i)=>i%2?"<mark>"+esc(p)+"</mark>":esc(p)).join("")}
function snip(c){const w=words(),lc=c.toLowerCase();let i=-1;for(const k of w){const p=lc.indexOf(k);if(p>=0&&(i<0||p<i))i=p}
 if(i<0)i=0;const a=Math.max(0,i-60),b=Math.min(c.length,i+140);return(a>0?"… ":"")+hl(c.slice(a,b).replace(/\s+/g," "))+(b<c.length?" …":"")}
function form(id,it){const n=it?it.id:"";return `<div class="form"><input id="t_${id}${n}" placeholder="Tajuk kecil" value="${it?esc(it.t):""}"><textarea id="c_${id}${n}" placeholder="Kandungan maklumat">${it?esc(it.c):""}</textarea><button class="p" onclick="commit('${id}','${n}')">Simpan</button> <button onclick="cancelEdit()">Batal</button></div>`}
function renderResults(){
 const{list,partial}=rankItems(D,q,id=>secOf(id).t);
 if(!list.length){$("app").innerHTML=`<p class="empty">Tiada maklumat dijumpai untuk “${esc(q.trim())}”. Cuba kata kunci lain.</p>`;$("sinfo").textContent="0 hasil";return}
 const lim=showAll?list.length:Math.min(5,list.length);
 let h=`<section id="hasil" class="pr"><div class="ph">Pejabat Kadi Daerah / Bahagian Undang-undang Syariah</div><div class="sh"><h2>Hasil carian: “${esc(q.trim())}”</h2><span><button onclick="printSec('hasil')">🖨 Cetak Hasil</button></span></div>`;
 list.slice(0,lim).forEach((r,n)=>{const x=r.x,s=secOf(x.sec),c=x.c||"",short=c.length<=200,full=n===0||short||opened.has(x.id)||edit===x.sec+x.id;
  h+=`<div class="rc${n===0?" top":""}" data-id="${x.id}"><div class="rl">${n===0?'<span class="badge">⭐ Paling sepadan</span>':""}${s.n}. ${esc(s.t)}</div>`;
  if(edit===x.sec+x.id)h+=form(x.sec,x);
  else{h+=`<h3>${hl(x.t||"")}</h3><div class="c${full?"":" sn"}">${full?hl(c):snip(c)}</div><div class="acts">`;
   if(!full)h+=`<button onclick="toggleOpen('${x.id}')">Papar penuh</button>`;
   else if(n>0&&!short)h+=`<button onclick="toggleOpen('${x.id}')">Tutup</button>`;
   h+=`<button onclick="printItem('${x.id}')">🖨 Cetak</button><button onclick="goSec('${x.sec}')">Lihat dalam bahagian</button>`;
   if(user)h+=`<button onclick="setEdit('${x.sec}${x.id}')">Sunting</button><button class="d" onclick="del(this,'${x.id}')">Padam</button>`;
   h+=`</div>`}
  h+=`</div>`});
 if(list.length>lim)h+=`<button onclick="showMore()">Papar semua ${list.length} hasil</button>`;
 $("app").innerHTML=h+"</section>";
 $("sinfo").textContent=partial?`Tiada padanan untuk semua perkataan. Dipaparkan ${list.length} padanan separa, disusun mengikut kesesuaian.`:`${list.length} hasil, disusun mengikut kesesuaian. Yang paling sepadan di atas.`}
function render(){
 $("nav").innerHTML=S.map((s,i)=>`<a href="#${s[0]}">${i+1}</a>`).join("");
 $("auth").innerHTML=user?`Admin: ${esc(user.email)} <button onclick="doLogout()">Log Keluar</button>`:`<button onclick="toggleLogin()">🔒 Log Masuk Admin</button>`;
 $("q").disabled=edit!==null;
 $("qc").style.display=q?"":"none";
 if(!ready)return;
 if(words().length){renderResults();return}
 $("sinfo").textContent="Taip kata kunci. Hasil paling sepadan dipaparkan di atas.";
 $("app").innerHTML=S.map((s,i)=>{const id=s[0],L=D.filter(x=>x.sec===id);
  let h=`<section id="${id}" class="pr"><div class="ph">Pejabat Kadi Daerah / Bahagian Undang-undang Syariah</div><div class="sh"><h2>${i+1}. ${esc(s[1])}</h2><span><button onclick="printSec('${id}')">🖨 Cetak</button> <button onclick="printSec('${id}')">⬇ PDF</button></span></div>`;
  if(!L.length)h+=`<p class="empty">Belum ada maklumat.</p>`;
  L.forEach(it=>{
   if(edit===id+it.id)h+=form(id,it);
   else h+=`<div class="item"><h3>${esc(it.t||"")}</h3><div class="c">${esc(it.c||"")}</div>`+(user?`<div class="acts"><button onclick="setEdit('${id}${it.id}')">Sunting</button><button class="d" onclick="del(this,'${it.id}')">Padam</button></div>`:"")+`</div>`});
  if(user){if(edit===id+"new")h+=form(id,null);else h+=`<button class="p addbtn" onclick="setEdit('${id}new')">+ Tambah Maklumat</button>`}
  return h+"</section>"}).join("")}
onSnapshot(col,snap=>{D=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));ready=true;if(edit===null)render()},
 e=>{$("app").innerHTML=`<p class="err">Gagal memuatkan data: ${esc(e.message)}</p>`});
onAuthStateChanged(auth,u=>{user=u;edit=null;if(u)$("login").style.display="none";render()});
window.setQ=v=>{q=v;opened.clear();showAll=false;render()};
window.clearQ=()=>{q="";opened.clear();showAll=false;$("q").value="";render();$("q").focus()};
window.focusTop=()=>{$("q").blur();const t=document.querySelector(".rc.top");if(t)t.scrollIntoView({behavior:"smooth",block:"start"})};
window.toggleOpen=id=>{opened.has(id)?opened.delete(id):opened.add(id);render()};
window.showMore=()=>{showAll=true;render()};
window.goSec=id=>{q="";opened.clear();showAll=false;$("q").value="";render();const e=$(id);if(e)e.scrollIntoView({behavior:"smooth",block:"start"})};
window.toggleLogin=()=>{const l=$("login");l.style.display=l.style.display==="none"?"block":"none"};
window.doLogin=async()=>{$("lerr").textContent="";try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value);$("pw").value=""}catch(e){$("lerr").textContent="E-mel atau kata laluan salah."}};
window.doLogout=()=>signOut(auth);
window.setEdit=k=>{edit=k;render()};
window.cancelEdit=()=>{edit=null;render()};
window.commit=async(id,n)=>{const t=$("t_"+id+n).value.trim(),c=$("c_"+id+n).value.trim();if(!t&&!c)return;
 try{if(n)await updateDoc(doc(db,"maklumat",n),{t,c});else await addDoc(col,{sec:id,t,c,ts:Date.now()});edit=null;render()}
 catch(e){alert("Gagal menyimpan: "+e.message)}};
window.del=async(b,n)=>{if(!b.classList.contains("c")){b.classList.add("c");b.textContent="Sahkan padam?";return}
 try{await deleteDoc(doc(db,"maklumat",n))}catch(e){alert("Gagal memadam: "+e.message)}};
window.printSec=id=>{document.body.classList.remove("oneitem");document.querySelectorAll("section").forEach(s=>s.classList.toggle("pr",!id||s.id===id));document.body.classList.toggle("one",!!id);window.print()};
window.printItem=id=>{document.body.classList.remove("one");document.querySelectorAll("section").forEach(s=>s.classList.add("pr"));document.querySelectorAll(".rc").forEach(e=>e.classList.toggle("pi",e.dataset.id===id));document.body.classList.add("oneitem");window.print()};
render();
</script><script>
/* Latar canvas: gradien lembut, orb beranimasi dan corak bintang geometri Islam */
(() => {
  const cv = document.getElementById("bg"), ctx = cv.getContext("2d");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TILE = 96, FRAME_MS = 33;
  const orbs = [
    { x: .12, y: .18, r: .55, rgb: "16,150,100",  speed: .00018, phase: 0 },
    { x: .88, y: .12, r: .50, rgb: "212,165,55",  speed: .00022, phase: 2 },
    { x: .72, y: .88, r: .60, rgb: "11,93,59",    speed: .00015, phase: 4 },
    { x: .08, y: .92, r: .45, rgb: "240,200,100", speed: .00020, phase: 1 },
  ];
  let w, h, pattern, last = 0;

  function buildPattern() {
    const t = document.createElement("canvas");
    t.width = t.height = TILE;
    const g = t.getContext("2d"), c = TILE / 2, r = TILE * .3;
    g.strokeStyle = "rgba(11,93,59,.13)";
    for (const a of [0, Math.PI / 4]) {
      g.save(); g.translate(c, c); g.rotate(a);
      g.strokeRect(-r, -r, r * 2, r * 2);
      g.restore();
    }
    g.strokeStyle = "rgba(184,145,47,.2)";
    g.beginPath(); g.arc(c, c, r * .5, 0, Math.PI * 2); g.stroke();
    for (const [x, y] of [[0, 0], [TILE, 0], [0, TILE], [TILE, TILE]]) {
      g.save(); g.translate(x, y); g.rotate(Math.PI / 4);
      g.strokeRect(-9, -9, 18, 18);
      g.restore();
    }
    pattern = ctx.createPattern(t, "repeat");
  }

  function draw(t) {
    const base = ctx.createLinearGradient(0, 0, w, h);
    base.addColorStop(0, "#ecfaf2");
    base.addColorStop(.5, "#fff8e6");
    base.addColorStop(1, "#dff2e9");
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, w, h);

    const size = Math.max(w, h);
    for (const o of orbs) {
      const x = (o.x + Math.sin(t * o.speed + o.phase) * .08) * w;
      const y = (o.y + Math.cos(t * o.speed * 1.3 + o.phase) * .08) * h;
      const r = o.r * size * .6;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, `rgba(${o.rgb},.32)`);
      g.addColorStop(1, `rgba(${o.rgb},0)`);
      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }

    ctx.save();
    ctx.translate((t * .008) % TILE, (t * .005) % TILE);
    ctx.fillStyle = pattern;
    ctx.fillRect(-TILE, -TILE, w + TILE, h + TILE);
    ctx.restore();
  }

  function loop(t) {
    if (t - last >= FRAME_MS) { last = t; draw(t); }
    requestAnimationFrame(loop);
  }

  function resize() {
    const dpr = Math.min(devicePixelRatio || 1, 1.5);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildPattern();
    draw(performance.now());
  }

  addEventListener("resize", resize);
  resize();
  if (!reduceMotion) requestAnimationFrame(loop);
})();
</script>
